patch:
  # Force simplified Chinese output (traditionalization switch to 汉字).
  "switches/@2/reset": 1
  "switches/@2/states": ["汉字", "漢字"]
  # ascii_composer: CapsLock must do traditional caps-lock (大写), never switch
  # to English. English is handled by fcitx5's keyboard-us input method.
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: noop
      Shift_L: noop
      Shift_R: noop
